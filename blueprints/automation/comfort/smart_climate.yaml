---
blueprint:
  name: Régulation thermique
  description: >-
    Keeps a room at the target temperature by nudging the heat pump
    setpoint from the room sensor, anticipating the outdoor temperature
    change of the next 3 hours from the hourly forecast. The anticipation
    gain learns from past outdoor changes. Only acts while the unit is in
    heat mode. Optionally raises the target during off-peak hours to store
    heat in the walls.
  domain: automation
  input:
    climate_entity:
      name: Climatisation
      selector:
        entity:
          domain: climate
    target_entity:
      name: Consigne
      selector:
        entity:
          domain: input_number
    temperature_sensor:
      name: Sonde de la pièce
      selector:
        entity:
          domain: sensor
          device_class: temperature
    weather_entity:
      name: Météo (prévisions horaires)
      selector:
        entity:
          domain: weather
    outdoor_change_sensor:
      name: Variation de la température extérieure sur 3 h
      selector:
        entity:
          domain: sensor
    weather_gain_entity:
      name: Gain météo (appris)
      selector:
        entity:
          domain: input_number
    rate_limit_sensor:
      name: Quota Onecta restant (facultatif)
      default: ''
      selector:
        entity:
          domain: sensor
    tariff_sensor:
      name: Période tarifaire
      selector:
        entity:
          domain: sensor
    off_peak_boost:
      name: Surchauffe en heures creuses
      default: 0
      selector:
        number:
          min: 0
          max: 2
          step: 0.5
          unit_of_measurement: °C

variables:
  climate_entity: !input climate_entity
  target_entity: !input target_entity
  temperature_sensor: !input temperature_sensor
  weather_entity: !input weather_entity
  outdoor_change_sensor: !input outdoor_change_sensor
  weather_gain_entity: !input weather_gain_entity
  rate_limit_sensor: !input rate_limit_sensor
  tariff_sensor: !input tariff_sensor
  off_peak_boost: !input off_peak_boost
  target: >-
    {{ states(target_entity) | float
       + (off_peak_boost if is_state(tariff_sensor, 'HC') else 0) }}
  room: "{{ states(temperature_sensor) | float(none) }}"
  current: "{{ state_attr(climate_entity, 'temperature') | float(none) }}"
  low: "{{ [target - 3, state_attr(climate_entity, 'min_temp') | float(0)] | max }}"
  high: "{{ [target + 5, state_attr(climate_entity, 'max_temp') | float(99)] | min }}"

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: time_pattern
    hours: /1
    id: tick
  - trigger: state
    entity_id: !input target_entity
    id: target
  - trigger: state
    entity_id: !input tariff_sensor
    to:
      - HC
      - HP
    id: tariff

conditions:
  - condition: template
    value_template: >-
      {{ is_state(climate_entity, 'heat')
         and room is number
         and current is number
         and (not rate_limit_sensor
              or states(rate_limit_sensor) | int(0) >= 20) }}

actions:
  - action: weather.get_forecasts
    target:
      entity_id: "{{ weather_entity }}"
    data:
      type: hourly
    response_variable: forecast
    continue_on_error: true

  - variables:
      gain: "{{ states(weather_gain_entity) | float(0) }}"
      hourly: >-
        {{ forecast[weather_entity].forecast
           if forecast is defined and weather_entity in forecast else [] }}
      outlook: >-
        {{ hourly[3].temperature - hourly[0].temperature
           if hourly | count > 3 else 0 }}
      error: "{{ target - room - gain * outlook }}"
      setpoint: >-
        {% set step = state_attr(climate_entity, 'target_temp_step') or 0.5 %}
        {% set base = [current, state_attr(climate_entity, 'current_temperature')
                                | float(0) - 1] | max
                      if error > 0 else current %}
        {% if trigger.id == 'target' %}
          {% set t = current + trigger.to_state.state | float(0)
                     - trigger.from_state.state
                       | float(trigger.to_state.state | float(0)) %}
        {% elif error | abs >= 1 %}
          {% set t = base + (2 * step if error > 0 else -2 * step) %}
        {% elif error | abs >= 0.3 %}
          {% set t = base + (step if error > 0 else -step) %}
        {% else %}
          {% set t = current %}
        {% endif %}
        {{ ([low, (t / step) | round * step, high] | sort)[1] }}
      new_gain: >-
        {{ ([0, gain + 0.002 * (room - target)
                * states(outdoor_change_sensor) | float(0), 0.5] | sort)[1]
           | round(3) }}

  - if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'tick' and low < current < high
             and new_gain != gain }}
    then:
      - action: input_number.set_value
        target:
          entity_id: "{{ weather_gain_entity }}"
        data:
          value: "{{ new_gain }}"

  - condition: template
    value_template: "{{ setpoint != current }}"

  - action: climate.set_temperature
    target:
      entity_id: "{{ climate_entity }}"
    data:
      temperature: "{{ setpoint }}"

mode: single
