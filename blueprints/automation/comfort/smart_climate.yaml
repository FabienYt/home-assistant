---
blueprint:
  name: Gestion du climat
  description: >-
    Keeps a room at the target temperature by adjusting the heat pump
    setpoint, optionally corrected with a room sensor. Only acts while the
    unit is in heat mode.
  domain: automation
  input:
    climate_entity:
      name: Climatisation
      selector:
        entity:
          domain: climate
    target_entity:
      name: Consigne
      selector:
        entity:
          domain: input_number
    temperature_sensor:
      name: Sonde de la pièce (facultatif)
      default: ''
      selector:
        entity:
          domain: sensor
          device_class: temperature
    rate_limit_sensor:
      name: Quota Onecta restant (facultatif)
      default: ''
      selector:
        entity:
          domain: sensor

variables:
  climate_entity: !input climate_entity
  target_entity: !input target_entity
  target: "{{ states(target_entity) | float }}"
  temperature_sensor: !input temperature_sensor
  rate_limit_sensor: !input rate_limit_sensor
  unit_temp: "{{ state_attr(climate_entity, 'current_temperature') }}"
  room: >-
    {{ states(temperature_sensor) | float(unit_temp)
       if temperature_sensor else unit_temp }}
  offset: >-
    {{ ([-3, unit_temp - room, 3] | sort)[1]
       if unit_temp is number and room is number else 0 }}
  setpoint: >-
    {% set step = state_attr(climate_entity, 'target_temp_step') or 0.5 %}
    {% set t = ((target + offset) / step) | round * step %}
    {{ ([state_attr(climate_entity, 'min_temp'), t,
         state_attr(climate_entity, 'max_temp')] | sort)[1] }}
  deadband: "{{ 1 if temperature_sensor else 0.5 }}"

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: time_pattern
    minutes: /30
  - trigger: state
    entity_id: !input target_entity

conditions:
  - condition: template
    value_template: >-
      {{ is_state(climate_entity, 'heat')
         and room is number
         and (not rate_limit_sensor
              or states(rate_limit_sensor) | int(0) >= 20)
         and (setpoint - state_attr(climate_entity, 'temperature')
              | float(0)) | abs >= deadband }}

actions:
  - action: climate.set_temperature
    target:
      entity_id: "{{ climate_entity }}"
    data:
      temperature: "{{ setpoint }}"

mode: single
