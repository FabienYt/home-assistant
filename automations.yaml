- id: '1787337813042'
  alias: Let's encrypt - Renouvellement du certificat
  description: ''
  triggers:
  - trigger: time
    at: 01:08:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  conditions: []
  actions:
  - action: hassio.app_start
    metadata: {}
    data:
      app: core_letsencrypt
  mode: single
- id: '1787338074079'
  alias: Recorder -  Purge
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: '8'
    id: purge
  - trigger: time
    at: 05:38:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
    id: purge_repack
  conditions: []
  actions:
  - action: recorder.purge
    metadata: {}
    data:
      repack: '{{ trigger.id == "purge_repack" }}'
  mode: single
- id: '1787338933113'
  alias: Home assistant - Mises à jour disponibles
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: state
    entity_id:
    - sensor.updates_available
  conditions:
  - condition: numeric_state
    entity_id: sensor.updates_available
    above: 0
    enabled: true
  actions:
  - action: script.notification_management
    data:
      recipient: signal_system
      title: "\U0001F195 Home Assistant - Mise(s) à jour disponible(s)"
      message: "{% for update in state_attr('sensor.updates_available', 'updates')
        -%}\n  {{ device_attr(update, 'name') }} : **{{ state_attr(update, 'installed_version')
        }}** -> **{{ state_attr(update, 'latest_version') }}**\n{% endfor %}"
  mode: single
- id: '1787340155650'
  alias: Home assistant - Échec de la sauvegarde
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - event.backup_automatic_backup
  conditions:
  - condition: state
    entity_id: event.backup_automatic_backup
    state:
    - failed
    attribute: event_type
  actions:
  - action: script.notification_management
    data:
      recipient: signal_system
      title: "\U0001F6A8 Home Assistant - Échec de la sauvegarde automatique"
      message: 'La dernière sauvegarde automatique a échoué en raison de : {{ state_attr("event.backup_automatic_backup",
        "failed_reason") }}'
  mode: single
- id: '1787412345678'
  alias: Add-ons - Service hors ligne
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.addons_offline
    attribute: addons
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none }}'
  - condition: template
    value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown']\
      \ and trigger.to_state.state not in ['unavailable', 'unknown'] }}"
  variables:
    previous: '{{ trigger.from_state.attributes.addons | default([], true) }}'
    current: '{{ trigger.to_state.attributes.addons | default([], true) }}'
    went_down: '{{ current | reject("in", previous) | list }}'
    recovered: '{{ previous | reject("in", current) | list }}'
    update_in_progress: "{{ states.update | selectattr('attributes.in_progress', 'defined')\
      \ | selectattr('attributes.in_progress') | list | count > 0 }}"
  actions:
  - repeat:
      for_each: '{{ went_down if not update_in_progress else [] }}'
      sequence:
      - variables:
          addon_name: '{{ trigger.to_state.attributes.names[repeat.item] | default(repeat.item)
            }}'
      - action: script.notification_management
        data:
          recipient: signal_system
          title: "\U0001F6A8 Home Assistant - Add-on hors ligne"
          message: "**{{ addon_name }}** est arrêté depuis plus d'une minute.\n\nTentative
            de redémarrage automatique en cours…"
      - action: hassio.app_start
        continue_on_error: true
        data:
          app: '{{ repeat.item }}'
      - wait_template: "{{ repeat.item not in (state_attr('sensor.addons_offline',\
          \ 'addons') or []) }}"
        timeout: '00:03:00'
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: script.notification_management
          data:
            recipient: signal_system
            title: "❌ Home Assistant - Échec du redémarrage d'un add-on"
            message: "**{{ addon_name }}** n'a pas redémarré après la relance automatique
              (`{{ repeat.item }}`). Une intervention manuelle est nécessaire."
  - repeat:
      for_each: '{{ recovered }}'
      sequence:
      - action: script.notification_management
        data:
          recipient: signal_system
          title: "✅ Home Assistant - Add-on rétabli"
          message: '**{{ trigger.from_state.attributes.names[repeat.item] | default(repeat.item)
            }}** est de nouveau opérationnel.'
  mode: parallel
  max: 10
- id: '1768732528389'
  alias: Gestion de la charge des VE
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
    id: refresh
  - trigger: event
    event_type: automation_reloaded
    id: refresh
  - trigger: time_pattern
    minutes: /15
    id: refresh
  - trigger: state
    entity_id:
    - sensor.jardin_teleinfo_periode_tarifaire_en_cours
    id: tariff
  - trigger: state
    entity_id:
    - input_boolean.ev_forced_charge
    id: forced
  - trigger: state
    entity_id:
    - input_boolean.ev_forced_charge
    to: 'on'
    for: '00:05:00'
    id: forced_timeout
  - trigger: state
    entity_id:
    - binary_sensor.ev_charging
    to: 'off'
    for: '00:05:00'
    id: forced_timeout
  - trigger: state
    entity_id:
    - switch.cellier_interrupteur_chargeur_des_ve
    id: switch
  conditions: []
  actions:
  - choose:
    - alias: Désactivation de la charge forcée des VE
      conditions:
      - condition: state
        entity_id: input_boolean.ev_forced_charge
        state: 'on'
        for: '00:05:00'
      - condition: state
        entity_id: binary_sensor.ev_charging
        state: 'off'
        for: '00:05:00'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_forced_charge
    - alias: Démarrage de la charge des VE
      conditions:
      - condition: template
        value_template: '{{ trigger.id != ''switch'' }}'
      - condition: state
        entity_id: switch.cellier_interrupteur_chargeur_des_ve
        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.ev_forced_charge
          state: 'on'
        - condition: state
          entity_id: sensor.jardin_teleinfo_periode_tarifaire_en_cours
          state: HC
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.cellier_interrupteur_chargeur_des_ve
    - alias: Arrêt de la charge des VE
      conditions:
      - condition: state
        entity_id: switch.cellier_interrupteur_chargeur_des_ve
        state: 'on'
      - condition: state
        entity_id: input_boolean.ev_forced_charge
        state: 'off'
      - condition: state
        entity_id: sensor.jardin_teleinfo_periode_tarifaire_en_cours
        state: HP
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.cellier_interrupteur_chargeur_des_ve
  mode: queued
  max: 10
