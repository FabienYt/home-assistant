---
id: ev_forced_charge_schedule
alias: Charge forcée des VE - Plages heures creuses
description: Temporaire

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: state
    entity_id:
      - sensor.periode_tarifaire
  - trigger: time_pattern
    minutes: /15
  - trigger: state
    entity_id:
      - switch.cellier_interrupteur_chargeur_des_ve
    from:
      - unavailable
      - unknown

conditions:
  - condition: template
    value_template: "{{ has_value('switch.cellier_interrupteur_chargeur_des_ve') }}"

actions:
  - action: >-
      input_boolean.turn_{{ 'on' if is_state('sensor.periode_tarifaire', 'HC') else 'off' }}
    target:
      entity_id: input_boolean.ev_forced_charge

mode: queued
