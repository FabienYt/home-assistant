---
id: awtrix_apps
alias: AWTRIX - Production solaire et météo
description: ''

triggers:
  - trigger: state
    entity_id:
      - sensor.salon_hoymiles_abris_bois_ac_power
      - sensor.jardin_station_meteo_shelly_ecowitt_ws90_apparent_temperature
  # back from unavailable after a clock reboot: pushed apps must be re-sent
  - trigger: state
    entity_id: sensor.salon_awtrix_ng_mqtt_prefix

conditions:
  - condition: template
    value_template: "{{ has_value('sensor.salon_awtrix_ng_mqtt_prefix') }}"

variables:
  prefix: "{{ states('sensor.salon_awtrix_ng_mqtt_prefix') }}"
  solar_entity: sensor.salon_hoymiles_abris_bois_ac_power
  temperature_entity: sensor.jardin_station_meteo_shelly_ecowitt_ws90_apparent_temperature

actions:
  - action: mqtt.publish
    data:
      topic: "{{ prefix }}/cmd/apps/pushed/solar"
      payload: >-
        {{ {'text': (states(solar_entity) | float(0) | round(0) | int) ~ ' W', 'icon': 'solar'} | to_json }}

  - if:
      - condition: template
        value_template: "{{ has_value(temperature_entity) }}"
    then:
      - action: mqtt.publish
        data:
          topic: "{{ prefix }}/cmd/apps/pushed/weather"
          payload: >-
            {{ {'text': (states(temperature_entity) | float | round(1)) ~ '°C', 'icon': 'temperature'} | to_json }}

mode: restart
