---
id: climate_bureau_fan_mode
alias: Bureau - Ventilateur silencieux la nuit
description: ''

triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /30

variables:
  wanted: "{{ 'quiet' if now().hour >= 20 or now().hour < 8 else 'auto' }}"

conditions:
  - condition: template
    value_template: >-
      {{ states('climate.bureau_room_temperature') not in
         ['off', 'unavailable', 'unknown']
         and state_attr('climate.bureau_room_temperature', 'fan_mode') != wanted
         and states('sensor.bureau_gateway_ratelimit_restant_aujourd_hui')
             | int(0) >= 20 }}

actions:
  - action: climate.set_fan_mode
    target:
      entity_id: climate.bureau_room_temperature
    data:
      fan_mode: "{{ wanted }}"

mode: single
