---
# SoC options taken from https://github.com/jtenniswood/espcontrol (jc1060p470 device package)
esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHZ
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true
    sdkconfig_options:
      # OTA erase of the alternate app partition can block loopTask past the default watchdog.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"

psram:
  mode: hex
  speed: 200MHz
