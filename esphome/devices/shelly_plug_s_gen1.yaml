---
packages:
  <<: !include_dir_named ../common

  board: !include ../boards/shelly_gen1.yaml
  wifi: !include ../components/wifi.yaml

substitutions:
  current_res: "0.000943"

  max_current: "10"
  max_power: "2400"
  max_temp: "70.0"

  power_cal_meas: "1710.0"
  power_cal_real: "1685.0"

  voltage_div: "2066"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      inverted: true
    name: "${name} - Button"
    on_press:
      - switch.toggle: relay

sensor:
  - platform: adc
    id: temp_analog_reading
    pin: A0

  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: GPIO12
      inverted: true
    cf_pin: GPIO05
    cf1_pin: GPIO14
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    current:
      name: "Intensité"
      unit_of_measurement: "A"
      accuracy_decimals: 3
      icon: mdi:flash-outline
      on_value_range:
        - above: ${max_current}
          then:
            - switch.turn_off: relay
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: Message from ${name}
                data_template:
                  message: Switch turned off because current exceeded ${max_current}A
    voltage:
      name: "Tension"
      unit_of_measurement: "V"
      icon: mdi:flash-outline
    power:
      name: "Puissance"
      id: power
      unit_of_measurement: "W"
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - ${power_cal_meas} -> ${power_cal_real}
      icon: mdi:flash-outline
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: relay
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: Message from ${name}
                data_template:
                  message: Switch turned off because power exceeded ${max_power}W
    update_interval: 10s

  - platform: ntc
    sensor: temp_resistance_reading
    name: ${name} - Température
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - switch.turn_off: relay
          - homeassistant.service:
              service: persistent_notification.create
              data:
                title: Message from ${name}
              data_template:
                message: Switch turned off because temperature exceeded ${max_temp}°C

  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 32kOhm

status_led:
  pin:
    number: GPIO02
    inverted: true

switch:
  - platform: gpio
    pin: GPIO15
    id: relay
    name: "Relais"
    on_turn_on:
      - output.turn_on: led
    on_turn_off:
      - output.turn_off: led

output:
  - platform: gpio
    pin: GPIO00
    inverted: true
    id: led
