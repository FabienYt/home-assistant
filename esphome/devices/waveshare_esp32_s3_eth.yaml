---
# https://www.waveshare.com/wiki/ESP32-S3-ETH
packages:
  <<: !include_dir_named ../common

  board: !include ../boards/esp32_s3_eth.yaml

  bluetooth_proxy: !include ../components/bluetooth_proxy.yaml

ethernet:
  type: W5500
  mosi_pin: GPIO11
  miso_pin: GPIO12
  clk_pin: GPIO13
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 25MHz

web_server: !remove
