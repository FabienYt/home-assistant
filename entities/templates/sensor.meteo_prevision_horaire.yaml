---
# Packs the next 12 hourly forecasts into one attribute for the Bureau screen:
# "13h|rainy|14°|0.1 mm|36 km/h;14h|...", split again on the device.
triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: event_template_reloaded
  - trigger: time_pattern
    minutes: /15

actions:
  - variables:
      weather: !secret meteo_france_weather_entity
  - action: weather.get_forecasts
    target:
      entity_id: "{{ weather }}"
    data:
      type: hourly
    response_variable: response
  - variables:
      hours: >-
        {% set ns = namespace(hours=[]) %}
        {% for f in response[weather].forecast[:12] %}
          {% set ns.hours = ns.hours + [as_local(as_datetime(f.datetime)).strftime('%Hh')
            ~ '|' ~ f.condition
            ~ '|' ~ (f.temperature | round(0) | int) ~ '°'
            ~ '|' ~ ('%.1f' | format(f.precipitation | default(0, true))) ~ ' mm'
            ~ '|' ~ (f.wind_speed | round(0) | int) ~ ' km/h'] %}
        {% endfor %}
        {{ ns.hours | join(';') }}

sensor:
  - default_entity_id: sensor.meteo_prevision_horaire
    name: Météo prévision horaire
    unique_id: 'b7a0cb43-7e67-4a07-a1d6-419251f67b6a'

    icon: mdi:weather-cloudy-clock

    state: "{{ hours.split(';')[0].split('|')[1] if hours else 'unknown' }}"

    attributes:
      heures: '{{ hours }}'
