---
sensor:
  - default_entity_id: sensor.zigbee_offline_devices
    name: Zigbee - Appareils hors ligne
    unique_id: '28c7d178-9755-41a0-925c-1c232b5099de'

    state: >-
      {%- set listed = this.attributes.devices | default([], true) if this is defined else [] -%}
      {%- set ns = namespace(devices=[]) -%}
      {%- for s in expand(integration_entities('mqtt'))
                    | rejectattr('domain', 'eq', 'update')
                    | selectattr('state', 'eq', 'unavailable') -%}
        {%- set device = device_id(s.entity_id) -%}
        {%- if device is not none
               and device_attr(device, 'via_device_id') is not none
               and (device in listed
                    or now() - s.last_changed > timedelta(minutes=5)) -%}
          {%- set ns.devices = ns.devices + [device] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.devices | unique | list | count }}

    attributes:
      devices: >-
        {%- set listed = this.attributes.devices | default([], true) if this is defined else [] -%}
        {%- set ns = namespace(devices=[]) -%}
        {%- for s in expand(integration_entities('mqtt'))
                      | rejectattr('domain', 'eq', 'update')
                      | selectattr('state', 'eq', 'unavailable') -%}
          {%- set device = device_id(s.entity_id) -%}
          {%- if device is not none
                 and device_attr(device, 'via_device_id') is not none
                 and (device in listed
                      or now() - s.last_changed > timedelta(minutes=5)) -%}
            {%- set ns.devices = ns.devices + [device] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.devices | unique | list | sort }}

    availability: "{{ is_state('binary_sensor.zigbee2mqtt_bridge_connection_state', 'on') }}"
